<!DOCTYPE html>
<html lang="pt-br">
<head>
    <title>CoreMotors - Cadastro</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Architects+Daughter&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="Style.css">

    <style>
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background-color: #2C4A63;
        }

        .cadastro-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .cadastro-box {
            background-color: #1A2A38;
            padding: 30px;
            border-radius: 8px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
        }

        .cadastro-box h2 {
            color: white;
            margin-bottom: 20px;
            font-size: 22px;
        }

        .input-group {
            margin-bottom: 12px;
            text-align: left;
        }

        .input-group label {
            color: white;
            font-size: 12px;
            margin-bottom: 5px;
            display: block;
        }

        .input-group input {
            width: 100%;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #009CDE;
            background-color: #101820;
            color: white;
            outline: none;
        }

        .btn-cadastrar {
            width: 100%;
            padding: 12px;
            background-color: #F5921D;
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

        .btn-cadastrar:hover {
            background-color: #009CDE;
        }

        .cadastro-footer {
            margin-top: 15px;
            font-size: 11px;
            color: #abb2b9;
        }

        .cadastro-footer a {
            color: #F5921D;
            text-decoration: none;
        }
        @media (min-width: 768px) {
          .login-container, .form-login {
              max-width: 400px;
              margin: 50px auto;
              padding: 40px;
              border: 1px solid #009CDE;
              border-radius: 10px;
          }
      }
    </style>
</head>
<body>
    <header>
        <nav class="navbar">
          <h1 id="logo">CoreMotors</h1>
          <div class="links">
            <a href="index.html">Home</a>
            <a href="filtro.html">Filtros</a>
            <a href="explorar.html">Todos</a>
            <a href="#">Ajuda</a>
        </div>
        <a class="login" href="index.html">Voltar</a>
      </nav>
    </header>
    
    <main class="cadastro-container">
        <div class="cadastro-box">
            <h2>Criar Conta</h2>
            <form>
                <div class="input-group">
                    <label>Nome Completo</label>
                    <input type="text" placeholder="Seu nome" required>
                </div>
                <div class="input-group">
                    <label>E-mail</label>
                    <input type="email" placeholder="Seu melhor e-mail" required>
                </div>
                <div class="input-group">
                    <label>Senha</label>
                    <input type="password" placeholder="Crie uma senha" required>
                </div>
                <div class="input-group">
                    <label>Confirmar Senha</label>
                    <input type="password" placeholder="Repita a senha" required>
                </div>
                <button type="submit" class="btn-cadastrar">FINALIZAR CADASTRO</button>
            </form>
            <div class="cadastro-footer">
                <p>Já possui uma conta? <a href="login.html">Faça login</a></p>
            </div>
        </div>
    </main>
</body>
</html>
