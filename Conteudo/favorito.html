<!DOCTYPE html>
<html lang="pt-br">
<head>
    <title>CoreMotors - Meus Favoritos</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Architects+Daughter&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="favorito.css">
</head>

<body>
    <header>
        <nav class="navbar">
          <h1 id="logo">CoreMotors</h1>
          <div class="links">
            <a href="index.html">Home</a>
            <a href="explorar.html">Explorar</a>
            <a href="ajuda.html">Ajuda</a>
          </div>
        </nav>
    </header>

    <main class="favoritos-container">
        <h2 style="color: #F5921D; text-align: center; margin-bottom: 30px; font-family: 'Architects Daughter', cursive;">Minhas Fichas Salvas</h2>
        
        <div id="lista-favoritos" class="vitrine-favoritos">
        </div>
    </main>

    <section class="menu-inferior">
        <a href="explorar.html" class="btn-grande">EXPLORAR MAIS CARROS</a>
        <a href="filtro.html" class="btn-grande">FILTRAR POR PERFIL</a>
        <a href="ajuda.html" class="btn-grande">AJUDA E GUIA</a>
    </section>

    <footer>
      <div class="footer-content">
        <p class="footer-slogan">Sua biblioteca técnica automotiva.</p>
        <p class="copyright">&copy; CoreMotors</p>
      </div>
    </footer>

    <script>
        function carregarFavoritos() {
            const lista = document.getElementById('lista-favoritos');
            const favoritos = JSON.parse(localStorage.getItem('favoritos')) || [];

            if (favoritos.length === 0) {
                lista.innerHTML = '<p class="vazio-msg">Você ainda não salvou nenhuma ficha técnica.</p>';
                return;
            }

            lista.innerHTML = favoritos.map((carro, index) => `
                <div class="card-carro">
                    <img src="${carro.foto}" alt="${carro.nome}">
                    <h3>${carro.nome}</h3>
                    <a class="btn-ver-ficha" href="${carro.link}">VER FICHA TÉCNICA</a>
                    <button onclick="removerFavorito(${index})" class="btn-remover">Remover da lista</button>
                </div>
            `).join('');
        }

        function removerFavorito(index) {
            let favoritos = JSON.parse(localStorage.getItem('favoritos'));
            favoritos.splice(index, 1);
            localStorage.setItem('favoritos', JSON.stringify(favoritos));
            carregarFavoritos();
        }

        carregarFavoritos();
    </script>
</body>
</html>
