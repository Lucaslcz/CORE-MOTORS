<!DOCTYPE html>
<html lang="pt-br">
<head>
    <title>CoreMotors - Login</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Architects+Daughter&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="Style.css">

    <style>
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .login-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-box {
            background-color: #1A2A38;
            padding: 40px;
            border-radius: 8px;
            width: 100%;
            max-width: 350px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        .login-box h2 {
            color: white;
            margin-bottom: 25px;
            font-family: Arial, sans-serif;
        }

        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .input-group label {
            color: #abb2b9;
            font-size: 12px;
            display: block;
            margin-bottom: 5px;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            border-radius: 4px;
            border: 1px solid #2C4A63;
            background-color: #0d1117;
            color: white;
            outline: none;
        }

        .input-group input:focus {
            border-color: #009CDE;
        }

        .btn-entrar {
            width: 100%;
            padding: 12px;
            background-color: #F5921D;
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

        .btn-entrar:hover {
            background-color: #009CDE;
            transform: scale(1.02);
        }

        .login-footer {
            margin-top: 20px;
            font-size: 12px;
            color: #abb2b9;
        }

        .login-footer a {
            color: #009CDE;
            text-decoration: none;
        }
        @media (min-width: 768px) {
          .login-container, .form-login {
              max-width: 400px;
              margin: 50px auto;
              padding: 40px;
              border: 1px solid #009CDE;
              border-radius: 10px;
          }
      }
    </style>
</head>
<body>
    <header>
        <nav class="navbar">
          <h1 id="logo">CoreMotors</h1>
          <div class="links">
            <a href="index.html">Home</a>
            <a href="filtro.html">Filtros</a>
            <a href="explorar.html">Todos</a>
            <a href="#">Ajuda</a>
        </div>
        <a class="login" href="index.html">Voltar</a>
      </nav>
    </header>

    <main class="login-container">
        <div class="login-box">
            <h2>Acesse sua conta</h2>
            <form>
                <div class="input-group">
                    <label>E-mail</label>
                    <input type="email" placeholder="Seu e-mail..." required>
                </div>
                <div class="input-group">
                    <label>Senha</label>
                    <input type="password" placeholder="Sua senha..." required>
                </div>
                <button type="submit" class="btn-entrar">ENTRAR</button>
            </form>
            <div class="login-footer">
                <p>Não tem uma conta? <a href="cadastro.html">Cadastre-se</a></p>
            </div>
        </div>
    </main>
</body>
</html>
