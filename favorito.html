<!DOCTYPE html>
<html lang="pt-br">
<head>
    <title>CoreMotors - Meus Favoritos</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Architects+Daughter&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="Style.css">
    
    <style>
        .favoritos-container { 
            padding: 40px 5%; 
            color: white; 
            min-height: 60vh; 
        }
        
        .vitrine-favoritos { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            gap: 30px; 
        }
        
        .card-carro { 
            background-color: #1A2A38; 
            width: 100%; 
            max-width: 400px; 
            padding: 25px; 
            border-radius: 15px; 
            border: 2px solid #009CDE; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            text-align: center;
        }
        
        .card-carro img { 
            width: 100%; 
            height: auto; 
            border-radius: 10px; 
            margin-bottom: 20px; 
            object-fit: contain;
        }

        .card-carro h3 { 
            font-size: 22px; 
            margin-bottom: 20px; 
            color: white;
            font-family: 'Architects Daughter', cursive;
        }

        .btn-ver-ficha {
            background-color: #F5921D;
            color: white;
            width: 100%;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            font-weight: bold;
            border-radius: 10px;
            font-size: 18px;
            transition: 0.3s;
        }

        .btn-remover {
            background: none;
            border: none;
            color: #ff4d4d;
            margin-top: 15px;
            text-decoration: underline;
            font-size: 14px;
            cursor: pointer;
        }

        .menu-inferior {
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding: 40px 8%;
            align-items: center;
        }

        .btn-grande {
            width: 100%;
            max-width: 500px;
            height: 70px;
            background-color: #1A2A38;
            color: #009CDE;
            text-decoration: none;
            font-weight: bold;
            font-size: 18px;
            border: 2px solid #009CDE;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-transform: uppercase;
            transition: 0.3s;
        }

        .btn-grande:hover {
            background-color: #009CDE;
            color: white;
        }

        .vazio-msg { text-align: center; color: #ccc; margin-top: 50px; font-size: 18px; }
    </style>
</head>
<body>
    <header>
        <nav class="navbar">
          <h1 id="logo">CoreMotors</h1>
          <div class="links">
            <a href="index.html">Home</a>
            <a href="explorar.html">Explorar</a>
            <a href="ajuda.html">Ajuda</a>
          </div>
        </nav>
    </header>

    <main class="favoritos-container">
        <h2 style="color: #F5921D; text-align: center; margin-bottom: 30px; font-family: 'Architects Daughter', cursive;">Minhas Fichas Salvas</h2>
        
        <div id="lista-favoritos" class="vitrine-favoritos">
        </div>
    </main>

    <section class="menu-inferior">
        <a href="explorar.html" class="btn-grande">EXPLORAR MAIS CARROS</a>
        <a href="filtro.html" class="btn-grande">FILTRAR POR PERFIL</a>
        <a href="ajuda.html" class="btn-grande">AJUDA E GUIA</a>
    </section>

    <footer>
      <div class="footer-content">
        <p class="footer-slogan">Sua biblioteca técnica automotiva.</p>
        <p class="copyright">&copy; CoreMotors</p>
      </div>
    </footer>

    <script>
        function carregarFavoritos() {
            const lista = document.getElementById('lista-favoritos');
            const favoritos = JSON.parse(localStorage.getItem('favoritos')) || [];

            if (favoritos.length === 0) {
                lista.innerHTML = '<p class="vazio-msg">Você ainda não salvou nenhuma ficha técnica.</p>';
                return;
            }

            lista.innerHTML = favoritos.map((carro, index) => `
                <div class="card-carro">
                    <img src="${carro.foto}" alt="${carro.nome}">
                    <h3>${carro.nome}</h3>
                    <a class="btn-ver-ficha" href="${carro.link}">VER FICHA TÉCNICA</a>
                    <button onclick="removerFavorito(${index})" class="btn-remover">Remover da lista</button>
                </div>
            `).join('');
        }

        function removerFavorito(index) {
            let favoritos = JSON.parse(localStorage.getItem('favoritos'));
            favoritos.splice(index, 1);
            localStorage.setItem('favoritos', JSON.stringify(favoritos));
            carregarFavoritos();
        }

        carregarFavoritos();
    </script>
</body>
</html>
