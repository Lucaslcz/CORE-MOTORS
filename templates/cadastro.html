<!DOCTYPE html>
<html lang="pt-br">
<head>
    <title>CoreMotors - Cadastro</title>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="description" content="Site de teste de aprendizado.">
    <meta name="author" content="Lucas Da Cruz & Luan Laya">
    <meta name="robots" content="index, follow">

    <link href="https://fonts.googleapis.com/css2?family=Architects+Daughter&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fjalla+One&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="{{ url_for('static', filename='index.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='cadastro.css') }}">
</head>
<body>
    <aside id="drawer" class="drawer">
        <div class="drawer-header">
            <button id="closeMenu" class="btn-fechar">×</button>
        </div>
        <nav class="drawer-links">
            <a href="{{ url_for('home') }}">Início</a>
            <a href="/explorar">Explorar</a>
            <a href="/filtro">Filtros</a>
            <a href="/favorito">Favoritos</a>
            <a href="/sobre">Sobre</a>
            <a href="/ajuda">Ajuda</a>
            <a href="#">Fale Conosco</a>
            <p class="copy">&copy; CoreMotors</p>
        </nav>
    </aside>
    <div id="overlay-menu" class="overlay-menu"></div>

    <header>
        <nav class="navbar">
            <h1 id="logo">CoreMotors</h1>
            <div style="display: flex; align-items: center; gap: 15px;">
                <button id="openMenu" class="btn-abrir-menu">☰</button>
            </div>
        </nav>
    </header>

<main class="cadastro-container">
    <div class="cadastro-box">
        <h2>Criar Conta</h2>
        <form action="/cadastrar" method="POST"> 
            <div class="input-group">
                <label>Nome Completo</label>
                <input type="text" name="nome" placeholder="Seu nome" required> 
            </div>
            <div class="input-group">
                <label>E-mail</label>
                <input type="email" name="email" placeholder="Seu melhor e-mail" required> 
            </div>
            <div class="input-group">
                <label>Senha</label>
                <input type="password" name="senha" placeholder="Crie uma senha" required> 
            </div>
            <div class="input-group">
                <label>Confirmar Senha</label>
                <input type="password" name="confirmar_senha" placeholder="Repita a senha" required> 
            </div>
            <button type="submit" class="btn-cadastrar">FINALIZAR CADASTRO</button>
        </form>
        <div class="cadastro-footer">
            <p>Já possui uma conta? <a href="{{ url_for('pagina_login') }}">Faça login</a></p>
        </div>
    </div>
</main>

    <script src="{{ url_for('static', filename='index.js') }}"></script>
</body>
</html>
